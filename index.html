<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos Verenize</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    font-family:'Montserrat', sans-serif;
}

body{
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:14px;
    overflow-x:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
    flex-wrap:wrap;
}

.logo{
    width:360px;
    max-width:100%;
    height:auto;
}

.header-info{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
}

input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

.total-arriba{
    font-size:26px;
    font-weight:700;
    border:3px solid #111;
    padding:12px 25px;
    background:#fafafa;
}

.reembolso-arriba{
    font-size:16px;
    font-weight:500;
    margin-top:5px;
}

.buscador{
    width:100%;
    max-width:500px;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#efefef;
    font-weight:600;
}

td.producto{
    text-align:left;
    min-width:280px;
}

.foto{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:8px;
    background:#eee;
}

input[type="number"]{
    width:90px;
}

.total-box{
    text-align:right;
    font-size:28px;
    font-weight:700;
    margin-top:20px;
}

.reembolso-box{
    font-size:18px;
    font-weight:500;
    margin-top:6px;
}

button{
    border:0;
    padding:13px 20px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-top:15px;
}

.enviar{
    background:#25D366;
    color:white;
}

.limpiar{
    background:#777;
    color:white;
}

@media(max-width:800px){
    body{padding:8px;}
    .container{padding:12px;}
    .logo{width:260px;}
    .total-arriba{font-size:22px;}
    table{font-size:12px;}
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <img class="logo" src="LOGO+SLOGAN(NEGRO) (5).png" alt="Verenize">
        </div>

        <div class="header-info">
            <input id="socio" placeholder="Socio comercial">
            <input id="fecha" type="date">

            <div class="total-arriba">
                <div>TOTAL ACUMULADO: $<span id="totalArriba">0.00</span></div>
                <div class="reembolso-arriba">
                    Total Reembolso: $<span id="reembolsoArriba">0.00</span>
                </div>
            </div>
        </div>
    </div>

    <input
        type="text"
        id="buscador"
        class="buscador"
        placeholder="Buscar producto..."
        onkeyup="filtrarProductos()"
    >

    <table>
        <thead>
            <tr>
                <th>Foto</th>
                <th>Producto</th>
                <th>Precio Distribuidor</th>
                <th>Precio Subdistribuidor</th>
                <th>Pzas x Caja</th>
                <th>Cant. Pzas</th>
                <th>Cajas detectadas</th>
                <th>Pzas sobrantes</th>
                <th>Desc.</th>
                <th>Importe</th>
            </tr>
        </thead>

        <tbody id="tabla"></tbody>
    </table>

    <div class="total-box">
        <div>TOTAL ACUMULADO: $<span id="total">0.00</span></div>
        <div class="reembolso-box">
            Total Reembolso: $<span id="reembolso">0.00</span>
        </div>
    </div>

    <button class="enviar" onclick="enviarWhatsapp()">Enviar pedido por WhatsApp</button>
    <button class="limpiar" onclick="limpiar()">Limpiar pedido</button>

</div>

<script>
const whatsapp = "526623641909";
const metaReembolso = 104400;

const productos = [
["Tratamiento de Keratina VP8 1000 ml",1800,2500,16,true],
["Tratamiento de Keratina VP12 1000 ml",1800,2500,16,true],
["Kit de Keratina Brasileña 300 ml",800,1200,24,true],
["Kit de Keratina Brasileña 100 ml",350,350,96,false],
["Vereplex Pro No. 1 500 ml",280,360,48,true],
["Kit Vereplex 500 ml",800,1200,24,false],
["Vereplex Pro No. 2 500 ml",250,350,24,true],
["Shampoo Purificante 1000 ml",350,416,16,true],
["Shampoo de Mantenimiento 500 ml",160,200,36,true],
["Acondicionador de Mantenimiento 500 ml",160,200,36,true],
["Shampoo de Mantenimiento 1000 ml",280,360,16,true],
["Acondicionador de Mantenimiento 1000 ml",280,360,16,true],
["Kit de Mantenimiento 1000 ml",450,616,16,true],
["Kit de Mantenimiento 500 ml",290,360,36,true],
["Kit de Mantenimiento 100 ml",120,120,96,false],
["Tratamiento Sérum de Argán 100 ml",200,280,48,true],
["Tratamiento Sérum de Argán 50 ml",120,120,63,false],
["Tratamiento Leave In 300 ml",150,200,48,true],
["Tratamiento Leave In 100 ml",85,85,96,false],
["Crema Hidratante para Rizos 300 ml",130,190,48,true],
["Gel Hidratante para Rizos 300 ml",145,200,48,true],
["Shot de Reparación Instantánea 12 ml",80,80,48,false],
["Caja Shot de Reparación Instantánea",360,480,36,false],
["Secadora V LUX NEGRA",2500,3150,10,true],
["Secadora V LUX BLANCA",2500,3150,10,true],
["Plancha de Titanio",1200,1575,20,true],
["Peine de Carbón",25,42,50,true],
["Cepillo Cuadrado",100,140,12,true],
["Cepillo Redondo",160,200,10,true],
["Brocha",25,42,50,true],
["Kimono",250,350,20,false],
["Mascarilla Mágica Nutritiva 100 ml",85,120,96,true],
["Tratamiento Sérum de Argán 50 ml",120,150,96,true],
["Mascarilla Mágica Nutritiva 500 ml",210,294,24,true],
["Set de Viaje para Cuidado del Cabello",480,580,10,false],
["Kit Vereplex PRO Sachet 30 ml",70,90,1,false]
];

function cargarTabla(){
    const tabla = document.getElementById("tabla");
    tabla.innerHTML = "";

    productos.forEach((p,i)=>{
        tabla.innerHTML += `
        <tr>
            <td><img class="foto" src="https://via.placeholder.com/80?text=V" alt="Producto"></td>
            <td class="producto">${p[0]}</td>
            <td>$${p[1]}</td>
            <td>$${p[2]}</td>
            <td>${p[3]}</td>
            <td>
                <input type="number" min="0" value="0" id="cantidad${i}" oninput="calcular()">
            </td>
            <td id="cajas${i}">0</td>
            <td id="sobrantes${i}">0</td>
            <td>${p[4] ? "10%" : "-"}</td>
            <td>$<span id="importe${i}">0.00</span></td>
        </tr>`;
    });
}

function calcular(){
    let total = 0;

    productos.forEach((p,i)=>{
        let cantidad = Number(document.getElementById(`cantidad${i}`).value) || 0;

        let cajasCompletas = Math.floor(cantidad / p[3]);
        let sobrantes = cantidad % p[3];

        let importe = 0;

        if(cantidad >= p[3]){
            importe = cantidad * p[1];
        }else{
            importe = cantidad * p[2];

            if(p[4] && cantidad > 0){
                importe = importe * 0.90;
            }
        }

        document.getElementById(`cajas${i}`).innerText = cajasCompletas;
        document.getElementById(`sobrantes${i}`).innerText = sobrantes;
        document.getElementById(`importe${i}`).innerText = importe.toFixed(2);

        total += importe;
    });

    let reembolso = total > metaReembolso ? total - metaReembolso : 0;

    document.getElementById("total").innerText = total.toFixed(2);
    document.getElementById("totalArriba").innerText = total.toFixed(2);
    document.getElementById("reembolso").innerText = reembolso.toFixed(2);
    document.getElementById("reembolsoArriba").innerText = reembolso.toFixed(2);
}

function filtrarProductos(){
    let filtro = document.getElementById("buscador").value.toLowerCase();
    let filas = document.querySelectorAll("#tabla tr");

    filas.forEach(fila=>{
        let producto = fila.querySelector(".producto").innerText.toLowerCase();

        if(producto.includes(filtro)){
            fila.style.display = "";
        }else{
            fila.style.display = "none";
        }
    });
}

function enviarWhatsapp(){
    let socio = document.getElementById("socio").value;
    let fecha = document.getElementById("fecha").value;
    let total = document.getElementById("total").innerText;
    let reembolso = document.getElementById("reembolso").innerText;

    let mensaje = `Hola, quiero realizar este pedido Verenize:%0A%0A`;
    mensaje += `Socio comercial: ${socio}%0A`;
    mensaje += `Fecha de pedido: ${fecha}%0A%0A`;

    productos.forEach((p,i)=>{
        let cantidad = Number(document.getElementById(`cantidad${i}`).value) || 0;
        let importe = document.getElementById(`importe${i}`).innerText;
        let cajas = document.getElementById(`cajas${i}`).innerText;
        let sobrantes = document.getElementById(`sobrantes${i}`).innerText;

        if(cantidad > 0){
            mensaje += `Producto: ${p[0]}%0A`;
            mensaje += `Cantidad total: ${cantidad} pzas%0A`;
            mensaje += `Cajas detectadas: ${cajas}%0A`;
            mensaje += `Piezas sobrantes: ${sobrantes}%0A`;

            if(cantidad >= p[3]){
                mensaje += `Precio aplicado: Distribuidor $${p[1]}%0A`;
            }else{
                mensaje += `Precio aplicado: Subdistribuidor $${p[2]}`;

                if(p[4]){
                    mensaje += ` | Desc. 10%`;
                }

                mensaje += `%0A`;
            }

            mensaje += `Importe: $${importe}%0A%0A`;
        }
    });

    mensaje += `TOTAL ACUMULADO: $${total}%0A`;
    mensaje += `TOTAL REEMBOLSO: $${reembolso}`;

    window.open(`https://wa.me/${whatsapp}?text=${mensaje}`,"_blank");
}

function limpiar(){
    productos.forEach((p,i)=>{
        document.getElementById(`cantidad${i}`).value = 0;
    });

    document.getElementById("buscador").value = "";
    filtrarProductos();
    calcular();
}

document.getElementById("fecha").valueAsDate = new Date();
cargarTabla();
calcular();
</script>

</body>
</html>
```
