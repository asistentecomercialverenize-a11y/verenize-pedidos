<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos Verenize</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

h1{
    text-align:center;
}

.producto{
    border:1px solid #ddd;
    padding:15px;
    margin-bottom:10px;
    border-radius:8px;
}

button{
    background:#25D366;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

#carrito{
    margin-top:20px;
    padding:15px;
    background:#fafafa;
    border-radius:8px;
}

.enviar{
    width:100%;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>Pedidos Verenize</h1>

<div class="producto">
    <h3>Shampoo Rizos</h3>
    <p>$250</p>
    <button onclick="agregar('Shampoo Rizos',250)">
        Agregar
    </button>
</div>

<div class="producto">
    <h3>Mascarilla Rizos</h3>
    <p>$350</p>
    <button onclick="agregar('Mascarilla Rizos',350)">
        Agregar
    </button>
</div>

<div id="carrito">
<h2>Carrito</h2>

<ul id="lista"></ul>

<h3>Total: $<span id="total">0</span></h3>

<button class="enviar" onclick="enviarWhatsapp()">
Enviar pedido por WhatsApp
</button>

</div>

</div>

<script>

let carrito=[];
let total=0;

function agregar(nombre,precio){

carrito.push({
nombre:nombre,
precio:precio
});

total+=precio;

mostrar();
}

function mostrar(){

let lista=document.getElementById("lista");

lista.innerHTML="";

carrito.forEach(item=>{

lista.innerHTML+=`<li>${item.nombre} - $${item.precio}</li>`;

});

document.getElementById("total").innerText=total;

}

function enviarWhatsapp(){

let mensaje="Hola, quiero realizar este pedido:%0A%0A";

carrito.forEach(item=>{
mensaje+=`${item.nombre} - $${item.precio}%0A`;
});

mensaje+=`%0ATotal: $${total}`;

window.open(
"https://wa.me/526621234567?text="+mensaje,
"_blank"
);

}

</script>

</body>
</html>
